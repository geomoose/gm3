<body>
    <div id="main">
        <div id="header">
            <img height="50" src="logo.png">
            <div id="toolbar"></div>
        </div>
        <div id="middle">
            <div id="tabs" class="tab-parent">
                <div class="tabs" role="tablist" aria-label="Sidebar">
                    <button type="button" id="catalog-tab" class="tab show" role="tab" aria-controls="catalog" aria-selected="true" onclick="showTab('catalog', event)"><span class="tab-label">Catalog</span></button>
                    <button type="button" id="favorites-tab" class="tab" role="tab" aria-controls="favorites" aria-selected="false" tabindex="-1" onclick="showTab('favorites', event)"><span class="tab-label">Favorites</span></button>
                    <button type="button" id="visible-layers-tab" class="tab" role="tab" aria-controls="visible-layers" aria-selected="false" tabindex="-1" onclick="showTab('visible-layers', event)"><span class="tab-label">Visible</span></button>
                    <button type="button" id="service-tab-tab" class="tab" role="tab" aria-controls="service-tab" aria-selected="false" tabindex="-1" onclick="showTab('service-tab', event)"><span class="tab-label">Results</span></button>
                </div>
                <div class="tab-content show" id="catalog" role="tabpanel" aria-labelledby="catalog-tab"></div>
                <div class="tab-content" id="favorites" role="tabpanel" aria-labelledby="favorites-tab"></div>
                <div class="tab-content" id="visible-layers" role="tabpanel" aria-labelledby="visible-layers-tab"></div>
                <div class="tab-content" id="service-tab" role="tabpanel" aria-labelledby="service-tab-tab"></div>
            </div>
            <button class="tab-toggler" onclick="toggleTabs('tabs')" title="Toggle Sidebar (F9)" aria-label="Toggle Sidebar"><i class="tab-toggler-icon"></i></button>
            <div id="map-pane">
                <div id="map-container">
                    <div id="map"></div>
                    <div id="basemap-toggle"></div>
                </div>
                <div id="results-grid"></div>
            </div>
        </div>
        <div id="footer">
            <span id="version"></span>
            <span id="coordinate-display"></span>
            <span id="jump-to-extent"></span>
        </div>
    </div>

    <div id="print-preview"></div>
    <div id="report-preview"></div>
    <div id="bookmark-modal"></div>

    <script type="text/javascript" src="config.js"></script>
    <script type="text/javascript" src="../geomoose/dist/geomoose.min.js"></script>
    <script type="text/javascript" src="../geomoose/dist/services/open-new.js"></script>
    <script type="text/javascript" src="../geomoose/dist/services/identify.js"></script>
    <script type="text/javascript" src="../geomoose/dist/services/search.js"></script>
    <script type="text/javascript" src="../geomoose/dist/services/select.js"></script>
    <script type="text/javascript" src="../geomoose/dist/services/geocode-osm.js"></script>
    <script type="text/javascript" src="../geomoose/dist/services/findme.js"></script>
    <script type="text/javascript" src="../geomoose/dist/services/zoomto.js"></script>
    <script type="text/javascript" src="tabs.js"></script>
    <script type="text/javascript" src="app.js"></script>
</body>
</html>
